name: Life Sim checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifesim?schema=public
      JWT_SECRET: ci-only-secret-key-change-before-production
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Type-check server and client
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build client
        run: npm run build
